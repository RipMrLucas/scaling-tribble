<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>py→c#</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1a1d26;
    --border: #2a2e3a;
    --text: #e4e6eb;
    --dim: #8b8fa3;
    --py-accent: #ffd43b;
    --cs-accent: #7c5cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.2rem 1.5rem 0.8rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header h1 span:first-child { color: var(--py-accent); }
  header h1 span:last-child { color: var(--cs-accent); }
  .setup {
    padding: 0.6rem 1.5rem;
    display: flex;
    gap: 0.6rem;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .setup input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.6rem;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.8rem;
    flex: 1;
    min-width: 180px;
  }
  .setup label {
    font-size: 0.75rem;
    color: var(--dim);
  }
  .panes {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 700px) {
    .panes { grid-template-columns: 1fr; }
  }
  .pane {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 260px;
  }
  .pane-label {
    padding: 0.5rem 1rem;
    font-size: 0.7rem;
    text-transform: lowercase;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .pane-label .tag-py { color: var(--py-accent); }
  .pane-label .tag-cs { color: var(--cs-accent); }
  .img-controls { display: flex; align-items: center; gap: 0.5rem; }
  .img-btn {
    cursor: pointer;
    color: var(--py-accent);
    border: 1px solid var(--border);
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    font-size: 0.7rem;
  }
  .img-btn:hover { border-color: var(--py-accent); }
  #imgName { color: var(--dim); font-size: 0.7rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #imgPreviewWrap { padding: 0 1rem; }
  #imgPreviewWrap img {
    max-height: 90px;
    border-radius: 4px;
    border: 1px solid var(--border);
    margin-top: 0.5rem;
    display: block;
  }
  #imgPreviewWrap .clear-img {
    display: inline-block;
    margin-top: 0.4rem;
    font-size: 0.7rem;
    color: var(--danger);
    cursor: pointer;
  }
  textarea, pre {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 1rem;
    font-family: inherit;
    font-size: 0.85rem;
    line-height: 1.5;
    resize: none;
    outline: none;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y: auto;
  }
  .cs-output.empty { color: var(--dim); }
  .controls {
    padding: 0.9rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.55rem 1.1rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--cs-accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #translateBtn {
    background: var(--cs-accent);
    border-color: var(--cs-accent);
    color: #fff;
    font-weight: 600;
  }
  #explainBtn { color: var(--dim); }
  .status {
    font-size: 0.75rem;
    color: var(--dim);
    margin-left: auto;
  }
  .explain-box {
    margin: 0 1.5rem 1.2rem;
    padding: 0.8rem 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--cs-accent);
    border-radius: 4px;
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--dim);
    display: none;
  }
  .explain-box.show { display: block; }
  ::placeholder { color: #5a5e6e; }
</style>
</head>
<body>

<header>
  <h1><span>py</span> → <span>c#</span></h1>
</header>

<div class="setup">
  <label>proxy URL</label>
  <input type="text" id="workerUrl" placeholder="https://your-project.vercel.app/api/translate">
  <label>model</label>
  <input type="text" id="modelName" placeholder="google/diffusiongemma-26b-a4b-it" value="google/diffusiongemma-26b-a4b-it">
</div>

<div class="panes">
  <div class="pane">
    <div class="pane-label">
      <span class="tag-py">python</span>
      <span class="img-controls">
        <label for="imgInput" class="img-btn">+ image</label>
        <input type="file" id="imgInput" accept="image/*" hidden>
        <span id="imgName"></span>
      </span>
    </div>
    <div id="imgPreviewWrap"></div>
    <textarea id="pyInput" placeholder="print(&quot;Hello, World!&quot;)  — or drop a screenshot of code above" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-label"><span class="tag-cs">c#</span><span>output</span></div>
    <pre id="csOutput" class="cs-output empty">// translation shows up here</pre>
  </div>
</div>

<div class="explain-box" id="explainBox"></div>

<div class="controls">
  <button id="translateBtn">Translate</button>
  <button id="explainBtn" disabled>Explanation</button>
  <span class="status" id="status"></span>
</div>

<script>
const workerUrlEl = document.getElementById('workerUrl');
const modelEl = document.getElementById('modelName');
const pyInput = document.getElementById('pyInput');
const csOutput = document.getElementById('csOutput');
const explainBox = document.getElementById('explainBox');
const translateBtn = document.getElementById('translateBtn');
const explainBtn = document.getElementById('explainBtn');
const statusEl = document.getElementById('status');
const imgInput = document.getElementById('imgInput');
const imgName = document.getElementById('imgName');
const imgPreviewWrap = document.getElementById('imgPreviewWrap');

let lastPython = '';
let lastCSharp = '';
let imageBase64 = null; // data URL of uploaded image, if any

// Remember proxy URL + model across sessions, meow
const savedUrl = localStorage.getItem('pytocs_proxyUrl');
const savedModel = localStorage.getItem('pytocs_model');
if (savedUrl) workerUrlEl.value = savedUrl;
if (savedModel) modelEl.value = savedModel;

workerUrlEl.addEventListener('input', () => {
  localStorage.setItem('pytocs_proxyUrl', workerUrlEl.value.trim());
});
modelEl.addEventListener('input', () => {
  localStorage.setItem('pytocs_model', modelEl.value.trim());
});

imgInput.addEventListener('change', () => {
  const file = imgInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    imageBase64 = reader.result;
    imgName.textContent = file.name;
    imgPreviewWrap.innerHTML = `<img src="${imageBase64}" alt="uploaded code"><span class="clear-img" id="clearImg">remove image</span>`;
    document.getElementById('clearImg').addEventListener('click', clearImage);
  };
  reader.readAsDataURL(file);
});

function clearImage() {
  imageBase64 = null;
  imgInput.value = '';
  imgName.textContent = '';
  imgPreviewWrap.innerHTML = '';
}

// Calls your Cloudflare Worker (which holds the real NIM key), not NIM directly.
// This keeps the API key off the client entirely, meow.
async function callNIM(promptText, maxTokens) {
  const workerUrl = workerUrlEl.value.trim();
  if (!workerUrl) throw new Error('set your worker URL first');

  const content = [{ type: 'text', text: promptText }];
  if (imageBase64) {
    content.push({ type: 'image_url', image_url: { url: imageBase64 } });
  }

  const res = await fetch(workerUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: modelEl.value.trim(),
      messages: [{ role: 'user', content }],
      max_tokens: maxTokens,
      temperature: 0.15,
      chat_template_kwargs: { enable_thinking: false }
    })
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

function stripFences(text) {
  return text.replace(/^```[a-z]*\n?/i, '').replace(/```$/,'').trim();
}

translateBtn.addEventListener('click', async () => {
  const code = pyInput.value.trim();
  if (!code && !imageBase64) { statusEl.textContent = 'paste python or add an image first'; return; }
  if (!workerUrlEl.value.trim()) { statusEl.textContent = 'need a worker URL'; return; }

  translateBtn.disabled = true;
  explainBtn.disabled = true;
  explainBox.classList.remove('show');
  csOutput.classList.remove('empty');
  csOutput.textContent = 'translating...';
  statusEl.textContent = '';

  try {
    const imgNote = imageBase64 ? ' If an image is attached, read the Python code from it first.' : '';
    const prompt = `Translate the following Python code to equivalent, idiomatic C#.${imgNote} Output ONLY the raw C# code, nothing else — no explanation, no markdown fences, no comments in the code unless the Python code already had comments.\n\nPython code:\n${code || '(see attached image)'}`;
    const result = await callNIM(prompt, 16384);
    lastPython = code || '(from image)';
    lastCSharp = stripFences(result);
    csOutput.textContent = lastCSharp;
    explainBtn.disabled = false;
    statusEl.textContent = 'done';
  } catch (err) {
    csOutput.textContent = '// translation failed, see status';
    statusEl.textContent = err.message;
  } finally {
    translateBtn.disabled = false;
  }
});

explainBtn.addEventListener('click', async () => {
  if (!lastCSharp) return;
  explainBtn.disabled = true;
  explainBox.classList.add('show');
  explainBox.textContent = 'thinking of something silly to say...';

  try {
    const prompt = `You just translated Python to C#. In 2-3 short sentences, explain the key differences a beginner should notice between the two versions. Be concise, casual, and a little silly — sprinkle in "meow" naturally instead of being dry and academic. No headers, no bullet points, just a couple fun sentences.\n\nPython:\n${lastPython}\n\nC#:\n${lastCSharp}`;
    const result = await callNIM(prompt, 16384);
    explainBox.textContent = result;
  } catch (err) {
    explainBox.textContent = `couldn't get an explanation: ${err.message}`;
  } finally {
    explainBtn.disabled = false;
  }
});
</script>

</body>
</html>
